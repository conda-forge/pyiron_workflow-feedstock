{% set python_min = "3.11" %}
{% set name = "pyiron_workflow" %}
{% set version = "0.19.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyiron_workflow-{{ version }}.tar.gz
  sha256: 072c5ae4dfa6d3338fe561d441871d28d2cba2af77ade45840e6d57b012ce9ab

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling ==1.30.1
    - hatch-vcs ==0.5.0
    - executorlib
    - flowrep
    - pint
    - pyiron_snippets
    - rdflib
    - semantikon
    - typeguard
  run:
    - python >={{ python_min }},<3.14
    - executorlib >=1.5.3,<1.11.0
    - flowrep >=0.6.0,<0.7.0
    - pint >=0.24,<=0.25.3
    - pyiron_snippets >=1.3.0,<2.0.0
    - rdflib >=7.1.4,<7.7.0
    - semantikon >=1.4.0,<1.5.0
    - typeguard >=4.2.0,<4.6.0

test:
  imports:
    - pyiron_workflow
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pyiron/pyiron_workflow
  summary: Graph-and-node based workflow tools.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - liamhuber
    - srmnitc
    - pyiron-runner
    - jan-janssen
    - pmrv
    - niklassiemer
