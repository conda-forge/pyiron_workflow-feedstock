schema_version: 1

context:
  name: pyiron_workflow
  version: "0.20.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pyiron_workflow-${{ version }}.tar.gz
  sha256: c8d5ab495201e251f98bca68ce76aab5601a4182610094983c9e56a9901db30b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.32.4
    - hatch-vcs ==0.5.0
    - flowrep
    - pint
    - pyiron_snippets
    - semantikon
    - typeguard
  run:
    - python >=${{ python_min }},<3.15
    - flowrep >=0.6.6,<0.7.0
    - pint >=0.24,<=0.25.3
    - pyiron_snippets >=1.3.0,<2.0.0
    - semantikon >=1.4.2,<1.5.0
    - typeguard >=4.2.0,<5.0.0

tests:
  - python:
      imports:
        - pyiron_workflow
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Graph-and-node based workflow tools.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_workflow

extra:
  recipe-maintainers:
    - liamhuber
    - srmnitc
    - pyiron-runner
    - jan-janssen
    - pmrv
    - niklassiemer
