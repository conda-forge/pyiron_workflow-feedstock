schema_version: 1

context:
  python_min: "3.11"
  name: pyiron_workflow
  version: "0.19.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pyiron_workflow-${{ version }}.tar.gz
  sha256: 7af56281f9fe2535b0c9ebce884979973b927a659fbe5192f5829b9e7cb2a134

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - pip
    - hatchling ==1.30.1
    - hatch-vcs ==0.5.0
    - executorlib
    - flowrep
    - pint
    - pyiron_snippets
    - rdflib
    - semantikon
    - typeguard
  run:
    - python >=${{ python_min }},<3.14
    - executorlib >=1.5.3,<1.11.0
    - flowrep >=0.6.0,<0.7.0
    - pint >=0.24,<=0.25.3
    - pyiron_snippets >=1.3.0,<2.0.0
    - rdflib >=7.1.4,<8.0.0
    - semantikon >=1.4.2,<1.5.0
    - typeguard >=4.2.0,<5.0.0

tests:
  - python:
      imports:
        - pyiron_workflow
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Graph-and-node based workflow tools.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_workflow

extra:
  recipe-maintainers:
    - liamhuber
    - srmnitc
    - pyiron-runner
    - jan-janssen
    - pmrv
    - niklassiemer
